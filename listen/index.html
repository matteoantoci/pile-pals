<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pile Pals: listen to the sounds</title>
    <style>
      body {
        font: 16px system-ui;
        max-width: 900px;
        margin: 1em auto;
        padding: 0 12px;
      }
      .row {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px;
        margin: 8px 0;
      }
      .row h3 {
        margin: 0 0 4px;
      }
      .row p {
        margin: 0 0 6px;
        color: #444;
      }
      .c {
        margin: 6px 0;
        padding: 6px;
        border-top: 1px dashed #ddd;
      }
      label {
        margin-right: 12px;
      }
      button {
        font-size: 16px;
        padding: 6px 12px;
        margin-right: 6px;
      }
      small {
        color: #666;
      }
      textarea {
        width: 100%;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Listen to the sounds</h1>
    <p>
      Listen on the iPhone, because the game plays through the iPhone speaker. Each Play button plays the sound at its
      game level. The game plays the "keep" sound of each slot now. Choose keep or replace for each slot, then tap Copy
      answers and paste the text into the chat.
    </p>
    <script type="module" src="/src/listen/main.ts"></script>
  </body>
</html>
